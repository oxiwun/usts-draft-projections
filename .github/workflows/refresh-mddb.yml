name: Refresh MDDB consensus boards

on:
  workflow_dispatch:
  schedule:
    # Once daily. 11:15 UTC is 6:15/7:15 AM Eastern depending on DST.
    - cron: '15 11 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape consensus big boards
        run: python scripts/scrape_mddb.py --limit 256 --output data/draft_projection.csv

      - name: Commit changed projection data
        run: |
          if git diff --quiet -- data/draft_projection.csv; then
            echo "No projection changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draft_projection.csv
          git commit -m "Update MDDB consensus draft projections"
          git push